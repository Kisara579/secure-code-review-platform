services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_review
      POSTGRES_USER: secure_review_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.docker file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_review_user -d secure_review"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/kisara579/secure-code-review-platform-worker:${IMAGE_TAG:-dev}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://secure_review_user:${POSTGRES_PASSWORD}@postgres:5432/secure_review
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/kisara579/secure-code-review-platform-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://secure_review_user:${POSTGRES_PASSWORD}@postgres:5432/secure_review
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/kisara579/secure-code-review-platform-worker:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://secure_review_user:${POSTGRES_PASSWORD}@postgres:5432/secure_review
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
