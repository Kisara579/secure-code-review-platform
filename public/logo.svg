<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <!-- Outer rim / subtle border glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0f284e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Shield stroke gradient -->
    <linearGradient id="shieldStrokeGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="25%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Code bracket stroke gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Center dot gradient -->
    <radialGradient id="centerDotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- Outer glow for shield -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur" />
      <feFlood flood-color="#0284c7" flood-opacity="0.45" result="flood" />
      <feComposite in="flood" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- Shield -->
  <path d="M 64 21.5
           L 38 28.5
           Q 32 30.5 32 36.5
           L 32 62
           C 32 82 46 98 64 106.5
           C 82 98 96 82 96 62
           L 96 36.5
           Q 96 30.5 90 28.5
           Z"
        fill="#070c17"
        fill-opacity="0.35"
        stroke="url(#shieldStrokeGrad)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Code Brackets < and > -->
  <!-- Left Chevron -->
  <path d="M 55 54 L 44 64 L 55 74"
        fill="none"
        stroke="url(#codeGrad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Right Chevron -->
  <path d="M 73 54 L 84 64 L 73 74"
        fill="none"
        stroke="url(#codeGrad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Center Dot -->
  <circle cx="64" cy="64" r="4.75" fill="url(#centerDotGrad)" />
</svg>