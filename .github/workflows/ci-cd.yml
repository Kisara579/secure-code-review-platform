name: SecureReview AI CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kisara579/secure-code-review-platform

jobs:
  build-and-push:
    name: Build and publish Docker images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:main

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-worker:main

  deploy:
    name: Deploy to Azure VM
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure SSH
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.AZURE_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/securereview_deploy
          chmod 600 ~/.ssh/securereview_deploy
          printf '%s %s\n' "$AZURE_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh -i ~/.ssh/securereview_deploy \
            -o IdentitiesOnly=yes \
            "$AZURE_USER@$AZURE_HOST" 'bash -se' <<'REMOTE'
              set -euo pipefail
              cd ~/secure-code-review-platform
              git fetch origin main
              git switch main
              git pull --ff-only origin main
              IMAGE_TAG=main docker compose --env-file .env.docker pull web worker migrate
              docker compose --env-file .env.docker up -d postgres redis
              IMAGE_TAG=main docker compose --env-file .env.docker run --rm migrate
              IMAGE_TAG=main docker compose --env-file .env.docker up -d --no-deps web worker
              IMAGE_TAG=main docker compose --env-file .env.docker ps
          REMOTE
